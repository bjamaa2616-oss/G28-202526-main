<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>FlaskApp Demo</title>
  <style>
    body { font-family: Arial; margin: 40px; }
    input, textarea { display: block; margin: 10px 0; padding: 8px; width: 300px; }
    button { padding: 10px; background: blue; color: white; border: none; }
    .item { border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
  </style>
</head>
<body>

<h1>Welcome to FlaskApp</h1>

<h3>Add Item</h3>
<input id="title" placeholder="Item title">
<textarea id="desc" placeholder="Description"></textarea>
<button onclick="addItem()">Add</button>

<h3>Items</h3>
<div id="items"></div>

<script>
let items = [];

function addItem() {
  let title = document.getElementById("title").value;
  let desc = document.getElementById("desc").value;

  let item = { title, desc };
  items.push(item);

  displayItems();
}

function displayItems() {
  let container = document.getElementById("items");
  container.innerHTML = "";

  items.forEach((item, index) => {
    container.innerHTML += `
      <div class="item">
        <strong>${item.title}</strong>
        <p>${item.desc}</p>
      </div>
    `;
  });
}
</script>

</body>
</html>
